[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "signalsnap-pytorch"
version = "2.0.0"
description = "SignalSnap (PyTorch): Higher-order spectral analysis for real, multi-channel time series."
readme = "README.md"
authors = [
    { name = "Armin Ghorbanietemad", email = "armin.ghorbanietemad@rub.de"},
    { name = "Markus Sifft", email = "markus.sifft@rub.de"},
    { name = "Daniel Hägele"},
]
maintainers = [
    { name = "David Ratayczak", email = "david.ratayczak@edu.rub.de" },
]
license = { file = "LICENSE" }
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=2.0.0",
    "torch>=2.6.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
hdf5 = ["h5py>=3.16.0"]
plotting = ["matplotlib>=3.10.7"]
test = [
    "pytest",
    "h5py>=3.16.0",
    "matplotlib>=3.10.7",
]

[project.urls]
Homepage = "https://github.com/Ratayczak/SignalSnap-PyTorch"

[tool.setuptools]
# This tells setuptools to look for code inside the 'src' directory
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--tb=short"
